[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-warehouse-design-agent"
version = "1.0.0"
description = "Deterministic Data Warehouse Design Agent in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
dw-agent = "dw_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
