type_mappings:
  sqlite:
    INTEGER: "INTEGER"
    VARCHAR: "TEXT"
    TEXT: "TEXT"
    DECIMAL: "REAL"
    FLOAT: "REAL"
    DATE: "TEXT"
    TIMESTAMP: "TEXT"
    BOOLEAN: "INTEGER"
  postgresql:
    INTEGER: "INTEGER"
    VARCHAR: "VARCHAR(255)"
    TEXT: "TEXT"
    DECIMAL: "NUMERIC(18,2)"
    FLOAT: "DOUBLE PRECISION"
    DATE: "DATE"
    TIMESTAMP: "TIMESTAMP"
    BOOLEAN: "BOOLEAN"
  snowflake:
    INTEGER: "NUMBER(38,0)"
    VARCHAR: "VARCHAR(255)"
    TEXT: "VARCHAR"
    DECIMAL: "NUMBER(18,2)"
    FLOAT: "FLOAT"
    DATE: "DATE"
    TIMESTAMP: "TIMESTAMP_NTZ"
    BOOLEAN: "BOOLEAN"
  bigquery:
    INTEGER: "INT64"
    VARCHAR: "STRING"
    TEXT: "STRING"
    DECIMAL: "NUMERIC"
    FLOAT: "FLOAT64"
    DATE: "DATE"
    TIMESTAMP: "TIMESTAMP"
    BOOLEAN: "BOOL"
  synapse:
    INTEGER: "INT"
    VARCHAR: "VARCHAR(255)"
    TEXT: "VARCHAR(MAX)"
    DECIMAL: "DECIMAL(18,2)"
    FLOAT: "FLOAT"
    DATE: "DATE"
    TIMESTAMP: "DATETIME2"
    BOOLEAN: "BIT"
